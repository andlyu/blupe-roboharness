name: RoboHarness website and public startup
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andlyu/blupe-remote-bots
          ref: 7a702d2264c2a1b7d051004279d0c73919a2e06c
          path: shared-runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6 ffmpeg
      - run: python -m pip install -r shared-runner/codex-runner/requirements-roboharness.txt
      - run: python backend/check_startup.py --runner-source shared-runner/codex-runner
      - run: PYTHONPATH=shared-runner/codex-runner/src:shared-runner/codex-runner python shared-runner/codex-runner/roboharness_preflight.py --output /tmp/roboharness-preflight.json
      - run: npm ci
      - run: node --test tests/*.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roboharness-preflight
          path: /tmp/roboharness-preflight.json
